name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # The original executable lives in a private repository that only this
    # repository's own runs can read, so builds from forks are skipped.
    if: >-
      github.repository == 'juandav/dcb_decomp' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        persist-credentials: false

    - uses: actions/checkout@v5
      with:
        repository: juandav/dcb_decomp_dependencies
        ssh-key: ${{ secrets.DCB_DEPENDENCIES_SSH_KEY }}
        path: dependencies
        persist-credentials: false

    - run: |
        mkdir -p disks/us
        cp dependencies/SLUS_013.28 dependencies/P.DRV disks/us/
        rm -rf dependencies

    - run: |
        sudo apt-get update
        sudo apt-get install -y binutils-mipsel-linux-gnu gcc-mipsel-linux-gnu

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip

    - run: pip install -r requirements.txt

    - run: tools/dl_deps.sh

    - run: |
        make generate
        make -j$(nproc)
        make compare

    - run: make report

    - uses: actions/upload-artifact@v6
      with:
        name: SLUS_013.28_report
        path: build/us/report.json
