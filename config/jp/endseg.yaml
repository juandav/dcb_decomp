  undefined_funcs_auto_path: build/jp/generated/undefined_funcs_auto_endseg.txt
  undefined_syms_auto_path: build/jp/generated/undefined_syms_auto_endseg.txt

  generate_asm_macros_files: False
  create_c_files: False

segments:
  # still one blob, loaded at OVERLAY_LOAD_ADDR (its calls to its own
  # functions say where)
  - name: endseg
    type: databin
    start: 0x0
    vram: 0x801EA3E8
    subalign: 4

  - [0x3714]
