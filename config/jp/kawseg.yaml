# Digimon Digital Card Battle, Japan (SLPS-02506): KAWSEG
name: kawseg
sha1: 44757f6f52638b5bb8ff915d60b2f777c3659e40
options:
  basename: kawseg
  # extracted from disks/jp/P.DRV by tools/extract_drv.py
  target_path: build/jp/disks/KAWSEG.BIN
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/jp/kawseg
  src_path: src/kawseg
  build_path: build/jp

  ld_script_path: build/jp/generated/kawseg.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x800871D8

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # the executable's symbols, which the overlay calls and reads
  symbol_addrs_path:
    - config/jp/symbols.txt
    # and its own
    - config/jp/symbols_kawseg.txt
  undefined_funcs_auto_path: build/jp/generated/undefined_funcs_auto_kawseg.txt
  undefined_syms_auto_path: build/jp/generated/undefined_syms_auto_kawseg.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  create_data_pads: False
  # no C yet: the overlay's code is still splat's assembly
  create_c_files: False

segments:
  # loaded at OVERLAY_LOAD_ADDR, the end of the executable's .bss
  - name: kawseg
    type: code
    start: 0x0
    vram: 0x801EA3E8
    align: 4
    subalign: 4
    subsegments:
      # us's modules, each with its rodata and data (tools/split_version.py)
      - [0x0, .rodata, cpu/kaw_cpu]
      - [0x34, .rodata, cpu/kaw_cpu_digivolve]
      - [0x64, rodata, cpu/kaw_battle_sim]
      - [0x77C, rodata, duel/kaw_tutorial]
      - [0x890, rodata, ui/kaw_duel_menu]
      - [0x9FC, rodata, duel/kaw_hand]
      - [0xF48, rodata, ui/kaw_match_intro]
      - [0x1054, rodata, ui/kaw_result]
      - [0x1078, rodata, ui/kaw_prize]
      - [0x11AC, rodata, duel/kaw_effect]
      - [0x124C, rodata, ui/kaw_hud]
      - [0x30F0, rodata, duel/kaw_bonus]
      - [0x30F4, rodata, ui/kaw_exp]
      - [0x3114, c, cpu/kaw_card_queries]
      - [0x3F84, c, cpu/kaw_cpu]
      - [0x50FC, c, cpu/kaw_cpu_placement]
      - [0x6B98, c, cpu/kaw_cpu_digivolve]
      - [0x7F70, c, cpu/kaw_cpu_attack]
      - [0x9A20, asm, cpu/kaw_battle_sim]
      - [0xEB80, asm, ui/kaw_duel_menu]
      - [0xEF40, asm, duel/kaw_hand]
      - [0xFAD8, asm, ui/kaw_match_intro]
      - [0x11C04, asm, ui/kaw_result]
      - [0x12D20, asm, ui/kaw_prize]
      - [0x14CD0, asm, ui/kaw_hud]
      - [0x14D18, asm, ui/kaw_exp]
      - [0x151E8, .data, cpu/kaw_card_queries]
      - [0x15218, data, ui/kaw_duel_menu]
      - [0x15270, data, ui/kaw_match_intro]
      - [0x15730, data, ui/kaw_hud]
      - [0x15798, data, duel/kaw_bonus]
