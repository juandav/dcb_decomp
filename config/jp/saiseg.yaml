# Digimon Digital Card Battle, Japan (SLPS-02506): SAISEG
name: saiseg
sha1: 73c955af3964cb84ce3f30d10af6dd1579f6cf63
options:
  basename: saiseg
  # extracted from disks/jp/P.DRV by tools/extract_drv.py
  target_path: build/jp/disks/SAISEG.BIN
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/jp/saiseg
  src_path: src/saiseg
  build_path: build/jp

  ld_script_path: build/jp/generated/saiseg.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x800871D8

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # the executable's symbols, which the overlay calls and reads
  symbol_addrs_path:
    - config/jp/symbols.txt
    # and its own
    - config/jp/symbols_saiseg.txt
  undefined_funcs_auto_path: build/jp/generated/undefined_funcs_auto_saiseg.txt
  undefined_syms_auto_path: build/jp/generated/undefined_syms_auto_saiseg.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  create_data_pads: False
  # no C yet: the overlay's code is still splat's assembly
  create_c_files: False

segments:
  # loaded at OVERLAY_LOAD_ADDR, the end of the executable's .bss
  - name: saiseg
    type: code
    start: 0x0
    vram: 0x801EA3E8
    align: 4
    subalign: 4
    subsegments:
      # us's modules, each with its rodata and data (tools/split_version.py);
      # jp's own objects where the code shows where they start and end
      - [0x0, rodata, sai_data]
      - [0x4, .rodata, player/sai_player_data_jp]
      - [0xE0, .rodata, ui/sai_text_jp]
      - [0x10C, rodata, script/sai_flags]
      - [0x114, rodata, player/sai_reward]
      - [0x278, rodata, map/sai_world_map]
      - [0x28C, rodata, ui/sai_labels]
      - [0x2B8, rodata, ui/sai_panel]
      - [0x3AC, rodata, script/sai_area_script]
      - [0x3D8, rodata, ui/sai_sprite]
      - [0x3F8, rodata, area/sai_opponent_select]
      - [0x500, rodata, area/sai_splash]
      - [0x538, rodata, area/sai_opponent_info]
      - [0x554, rodata, hacking/sai_word_input]
      - [0x56C, rodata, area/sai_area]
      # jp's key items and player data screen: one object, as one table of
      # its states holds all its functions from here to the message window's
      - [0x5A4, c, player/sai_player_data_jp]
      - [0x1F40, c, ui/sai_text_jp]
      - [0x2620, asm, script/sai_flags]
      - [0x29AC, asm, player/sai_reward]
      - [0x32E4, asm, map/sai_world_map]
      - [0x3764, asm, ui/sai_labels]
      - [0x4508, asm, ui/sai_panel]
      - [0x6004, asm, script/sai_area_script]
      - [0x6398, asm, ui/sai_sprite]
      - [0x6AC0, asm, area/sai_opponent_select]
      - [0x79CC, asm, area/sai_splash]
      - [0x80D4, asm, area/sai_opponent_info]
      - [0x91E4, asm, hacking/sai_word_input]
      - [0x9700, asm, area/sai_area]
      - [0xB0D8, .data, player/sai_player_data_jp]
      - [0xBC18, data, sai_data]
      - [0xBD50, data, sai_bss]
      - [0xCCF0, data, ui/sai_sprite]
      - [0xD1BC, data, hacking/sai_word_input]

  - [0xD218]
