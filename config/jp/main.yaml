# Digimon Digital Card Battle, Japan (SLPS-02506): the executable
name: main
sha1: 447c5256757685728bfbecaf3b3b2e7c0164b6cc
options:
  basename: main
  target_path: disks/jp/SLPS_025.06
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/jp/main
  asset_path: asm/jp/main/bin
  src_path: src/main
  build_path: build/jp

  ld_script_path: build/jp/generated/main.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  # the startup code (__SN_ENTRY_POINT) sets $gp to the start of .bss
  gp_value: 0x800871D8

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/jp/symbols.txt
    - config/jp/symbols_overlay_calls.txt
  undefined_funcs_auto_path: build/jp/generated/undefined_funcs_auto_main.txt
  undefined_syms_auto_path: build/jp/generated/undefined_syms_auto_main.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  create_data_pads: False
  # no C yet: the game's code is still splat's assembly
  create_c_files: False

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    # the startup code clears .bss up to 0x801EA3E8, OVERLAY_LOAD_ADDR
    bss_size: 0x163210
    align: 4
    subalign: 4
    subsegments:
      # us's modules, each with its rodata and data (tools/split_version.py)
      - [0x800, rodata, system/render_loop]
      - [0x818, .rodata, system/cd_file]
      - [0x820, rodata, ui/window]
      - [0x820, rodata, system/pad]
      - [0x83C, .rodata, gfx/prim_util]
      - [0x850, .rodata, script/script]
