  compiler: GCC

  asm_path: asm/us/main
  src_path: src/main
  build_path: build/us

  ld_script_path: build/us/generated/main.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True
  gp_value: 0x80077A08

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/us/symbols.txt
    # the overlay functions the executable calls, under their overlay's names
    - config/us/symbols_overlay_calls.txt

  undefined_funcs_auto_path: build/us/generated/undefined_funcs_auto_main.txt
  undefined_syms_auto_path: build/us/generated/undefined_syms_auto_main.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  migrate_rodata_to_functions: True
  create_data_pads: False
  # the C files already exist; psyq is split under src/main/psyq/
  create_c_files: False
  # hand-written assembly (hasm segments) is source too: src/main/<name>.s,
  # which splat writes only when it doesn't exist yet
  hasm_in_src_path: True

