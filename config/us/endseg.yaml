name: endseg
sha1: 3743afc936485724a58f213a2f52720a1cad53ed
options:
  basename: endseg
  # extracted from disks/us/P.DRV by tools/extract_drv.py
  target_path: build/us/disks/ENDSEG.BIN
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/us/endseg
  src_path: src/endseg
  build_path: build/us

  ld_script_path: build/us/generated/endseg.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True
  gp_value: 0x80077A08

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # the executable's symbols, which the overlay calls and reads
  symbol_addrs_path:
    - config/us/symbols.txt
    - config/us/symbols_endseg.txt

  undefined_funcs_auto_path: build/us/generated/undefined_funcs_auto_endseg.txt
  undefined_syms_auto_path: build/us/generated/undefined_syms_auto_endseg.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  migrate_rodata_to_functions: True
  create_data_pads: False
  # src/endseg/endseg.c exists
  create_c_files: False

segments:
  # the ending: loaded at OVERLAY_LOAD_ADDR, the end of the executable's .bss
  - name: endseg
    type: code
    start: 0x0
    vram: 0x801DDF38
    align: 4
    subalign: 4
    subsegments:
      - [0x0, .rodata, endseg]
      - [0x8D4, c, endseg]
      - [0x2C7C, .data, endseg]

  - [0x2E64]
