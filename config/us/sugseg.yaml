name: sugseg
sha1: cfbc3b5e812d6fabb29077e1bb653d01eb00feb6
options:
  basename: sugseg
  # extracted from disks/us/P.DRV by tools/extract_drv.py
  target_path: build/us/disks/SUGSEG.BIN
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/us/sugseg
  src_path: src/sugseg
  build_path: build/us

  ld_script_path: build/us/generated/sugseg.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True
  gp_value: 0x80077A08

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # the executable's symbols, which the overlay calls and reads
  symbol_addrs_path:
    - config/us/symbols.txt
    - config/us/symbols_sugseg.txt

  undefined_funcs_auto_path: build/us/generated/undefined_funcs_auto_sugseg.txt
  undefined_syms_auto_path: build/us/generated/undefined_syms_auto_sugseg.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  migrate_rodata_to_functions: True
  create_data_pads: False
  # the C files in src/sugseg/ exist
  create_c_files: False

segments:
  # loaded at OVERLAY_LOAD_ADDR, the end of the executable's .bss
  - name: sugseg
    type: code
    start: 0x0
    vram: 0x801DDF38
    align: 4
    subalign: 4
    subsegments:
      - [0x0, .rodata, effect/sug_history]
      - [0x4, .rodata, effect/sug_gradient]
      - [0x18, .rodata, effect/sug_tex_anim]
      - [0x5C, .rodata, effect/sug_effect_script]
      - [0x164, .rodata, battle/sug_sprite]
      - [0x188, c, effect/sug_history]
      - [0x7AC, c, effect/sug_sphere]
      - [0x3FB0, c, effect/sug_gradient]
      - [0x5730, c, effect/sug_model_effect]
      - [0x5E5C, c, effect/sug_stage_fade]
      - [0x6274, c, effect/sug_sprite_effect]
      - [0x648C, c, effect/sug_trail]
      - [0x84EC, c, effect/sug_fade_rect]
      - [0x8798, c, effect/sug_scroll_texture]
      - [0x8C08, c, effect/sug_tex_anim]
      - [0x9770, c, effect/sug_light_motion]
      - [0x9CB4, c, effect/sug_effect_script]
      - [0xC63C, c, effect/sug_screen_copy]
      - [0xD448, c, battle/sug_sprite]
      - [0xDF34, c, battle/sug_camera]
      - [0xE068, c, battle/sug_hud]
      - [0xFD14, c, battle/sug_battle]
      - [0x11324, c, sug_bss]
      - [0x11324, .data, effect/sug_light_motion]
      - [0x11364, .data, battle/sug_battle]
      - [0x11368, .data, effect/sug_screen_copy]
      - [0x1136C, .data, effect/sug_effect_script]
      - [0x11444, .data, sug_bss]

  - [0x11A70]
