name: openseg
sha1: 28080d23c69e25caea7564ef6a862bd7e248b17c
options:
  basename: openseg
  # extracted from disks/us/P.DRV by tools/extract_drv.py
  target_path: build/us/disks/OPENSEG.BIN
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/us/openseg
  src_path: src/openseg
  build_path: build/us

  ld_script_path: build/us/generated/openseg.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True
  gp_value: 0x80077A08

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # the executable's symbols, which the overlay calls and reads
  symbol_addrs_path:
    - config/us/symbols.txt
    - config/us/symbols_openseg.txt

  undefined_funcs_auto_path: build/us/generated/undefined_funcs_auto_openseg.txt
  undefined_syms_auto_path: build/us/generated/undefined_syms_auto_openseg.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  migrate_rodata_to_functions: True
  create_data_pads: False
  # the C files in src/openseg/ exist
  create_c_files: False

segments:
  # loaded at OVERLAY_LOAD_ADDR, the end of the executable's .bss
  - name: openseg
    type: code
    start: 0x0
    vram: 0x801DDF38
    align: 4
    subalign: 4
    subsegments:
      - [0x0, .rodata, title/open_movie]
      - [0x18, .rodata, friend/open_trade]
      - [0x24C, .rodata, registration/open_registration]
      - [0xAFC, .rodata, registration/open_name_entry]
      - [0xBA4, .rodata, registration/open_starter]
      - [0xC14, .rodata, title/open_title]
      - [0xC70, .rodata, friend/open_friend]
      - [0xDF4, .rodata, memcard/open_memcard]
      - [0x1A00, .rodata, memcard/open_save]
      - [0x1AE8, c, title/open_movie]
      - [0x29A0, c, friend/open_trade]
      - [0x6CE0, c, registration/open_registration]
      - [0x9080, c, registration/open_name_entry]
      - [0xA334, c, registration/open_starter]
      - [0xB30C, c, title/open_title]
      - [0xC93C, c, friend/open_friend]
      - [0xDBC4, c, memcard/open_memcard]
      - [0x10A60, c, memcard/open_save]
      - [0x11FD0, c, open_bss]
      - [0x11FD0, .data, title/open_movie]
      - [0x11FF8, .data, friend/open_trade]
      - [0x12100, .data, registration/open_registration]
      - [0x1252C, .data, registration/open_name_entry]
      - [0x12588, .data, registration/open_starter]
      - [0x125C8, .data, title/open_title]
      - [0x125D4, .data, memcard/open_memcard]
      - [0x128C4, .data, memcard/open_save]
      - [0x128D0, .data, open_bss]

  - [0x1A250]
