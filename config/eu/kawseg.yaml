# Digimon Digital Card Battle, Europe (SLES-03900): KAWSEG
name: kawseg
sha1: ed2fb11106e3739ed678add83672a30af183e14b
options:
  basename: kawseg
  # extracted from disks/eu/P.DRV by tools/extract_drv.py
  target_path: build/eu/disks/KAWSEG.BIN
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/kawseg
  src_path: src/kawseg
  build_path: build/eu

  ld_script_path: build/eu/generated/kawseg.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x8007A224

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # the executable's symbols, which the overlay calls and reads
  symbol_addrs_path:
    - config/eu/symbols.txt
    # and its own
    - config/eu/symbols_kawseg.txt
  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_kawseg.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_kawseg.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  migrate_rodata_to_functions: True
  create_data_pads: False
  # the C files in src/kawseg/ exist; mk/version/eu.mk lists those eu builds
  create_c_files: False

segments:
  # loaded at OVERLAY_LOAD_ADDR, the end of the executable's .bss
  - name: kawseg
    type: code
    start: 0x0
    vram: 0x801E0890
    align: 4
    subalign: 4
    subsegments:
      # us's modules, each with its rodata and data (tools/split_version.py)
      - [0x0, .rodata, cpu/kaw_cpu]
      - [0x44, .rodata, cpu/kaw_cpu_digivolve]
      - [0x84, .rodata, cpu/kaw_battle_sim]
