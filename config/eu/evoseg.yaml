# Digimon Digital Card Battle, Europe (SLES-03900): EVOSEG
name: evoseg
sha1: 85073893733acb93c36d3853ffe6c2890021522d
options:
  basename: evoseg
  # extracted from disks/eu/P.DRV by tools/extract_drv.py
  target_path: build/eu/disks/EVOSEG.BIN
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/evoseg
  src_path: src/evoseg
  build_path: build/eu

  ld_script_path: build/eu/generated/evoseg.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x8007A224

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # the executable's symbols, which the overlay calls and reads
  symbol_addrs_path:
    - config/eu/symbols.txt
    # and its own
    - config/eu/symbols_evoseg.txt
  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_evoseg.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_evoseg.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  create_data_pads: False
  # no C yet: the overlay's code is still splat's assembly
  create_c_files: False

segments:
  # loaded at OVERLAY_LOAD_ADDR, the end of the executable's .bss
  - name: evoseg
    type: code
    start: 0x0
    vram: 0x801E0890
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata, evoseg]
      - [0x1720, asm, evoseg]
      - [0x11474, data, evoseg]

  - [0x175C4]
