# Digimon Digital Card Battle, Europe (SLES-03900): SAISEG
name: saiseg
sha1: 9157410a265d2a22bd39140fbc59c60b00119db0
options:
  basename: saiseg
  # extracted from disks/eu/P.DRV by tools/extract_drv.py
  target_path: build/eu/disks/SAISEG.BIN
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/saiseg
  src_path: src/saiseg
  build_path: build/eu

  ld_script_path: build/eu/generated/saiseg.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x8007A224

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # the executable's symbols, which the overlay calls and reads
  symbol_addrs_path:
    - config/eu/symbols.txt
    # and its own
    - config/eu/symbols_saiseg.txt
  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_saiseg.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_saiseg.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  migrate_rodata_to_functions: True
  create_data_pads: False
  # the C files in src/saiseg/ exist; mk/version/eu.mk lists those eu builds
  create_c_files: False

segments:
  # loaded at OVERLAY_LOAD_ADDR, the end of the executable's .bss
  - name: saiseg
    type: code
    start: 0x0
    vram: 0x801E0890
    align: 4
    subalign: 4
    subsegments:
      # us's modules, each with its rodata and data (tools/split_version.py)
      - [0x0, .rodata, sai_data]
      - [0x358, .rodata, ui/sai_text]
      - [0x3B8, .rodata, script/sai_flags]
      - [0x3E0, .rodata, ui/sai_labels]
      - [0x3F0, .rodata, player/sai_player_data]
      - [0x528, .rodata, ui/sai_panel]
      - [0x554, .rodata, script/sai_area_script]
      - [0x60C, .rodata, area/sai_area]
      - [0x6AC, .rodata, area/sai_opponent_select]
      - [0x6F8, .rodata, area/sai_opponent_info]
      - [0x75C, .rodata, area/sai_splash]
      - [0x770, .rodata, hacking/sai_hacking]
      - [0x7D0, .rodata, hacking/sai_word_input]
      - [0x8E8, .rodata, ui/sai_sprite]
      - [0x8FC, .rodata, map/sai_world_map]
      - [0xA3C, .rodata, player/sai_reward]
      - [0xAD4, .rodata, player/sai_partner_get]
      - [0xB38, .rodata, player/sai_digi_parts]
      - [0x1B2C, c, ui/sai_text]
      - [0x21E8, c, ui/sai_choice]
      - [0x29F8, c, script/sai_flags]
      - [0x2FD8, c, ui/sai_labels]
