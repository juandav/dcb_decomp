# Digimon Digital Card Battle, Europe (SLES-03900): SUBSEG
name: subseg
sha1: 63d5cc7994208794e8dd7d508c307c90b5b8f1da
options:
  basename: subseg
  # extracted from disks/eu/P.DRV by tools/extract_drv.py
  target_path: build/eu/disks/SUBSEG.BIN
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/subseg
  src_path: src/subseg
  build_path: build/eu

  ld_script_path: build/eu/generated/subseg.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x8007A224

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # the executable's symbols, which the overlay calls and reads
  symbol_addrs_path:
    - config/eu/symbols.txt
    # and its own
    - config/eu/symbols_subseg.txt
  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_subseg.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_subseg.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  migrate_rodata_to_functions: True
  create_data_pads: False
  # the C files in src/subseg/ exist; mk/version/eu.mk lists those eu builds
  create_c_files: False

segments:
  # loaded at OVERLAY_LOAD_ADDR, the end of the executable's .bss
  - name: subseg
    type: code
    start: 0x0
    vram: 0x801E0890
    align: 4
    subalign: 4
    subsegments:
      # us's modules, each with its rodata and data (tools/split_version.py)
      - [0x0, .rodata, deck/sub_name_entry]
      - [0xAC, .rodata, deck/sub_base_deck]
      - [0xE8, .rodata, partner/sub_partner]
      - [0x11CC, .rodata, deck/sub_sort]
      - [0x1374, .rodata, deck/sub_deck_editor]
      - [0x13C8, .rodata, deck/sub_deck_screens]
      - [0x196C, .rodata, deck/sub_auto_deck]
      - [0x1A6C, c, deck/sub_name_entry]
      - [0x301C, c, deck/sub_base_deck]
      - [0x34FC, c, partner/sub_partner]
      - [0x76C0, c, deck/sub_sort]
      - [0xA300, c, deck/sub_deck_editor]
      - [0xAE78, c, deck/sub_deck_screens]
      - [0x11DC0, c, deck/sub_auto_deck]
      - [0x13630, c, sub_bss]
      - [0x13630, .data, deck/sub_name_entry]
      - [0x1368C, .data, deck/sub_base_deck]
      - [0x136B8, .data, partner/sub_partner]
      - [0x13D3C, .data, deck/sub_sort]
      - [0x13F68, .data, deck/sub_deck_screens]
      - [0x13F7C, .data, deck/sub_auto_deck]
      - [0x14050, .data, sub_bss]

  - [0x16200]
