# Digimon Digital Card Battle, Europe (SLES-03900): NISSEG
name: nisseg
sha1: 9fb38eea63c6a062a38ee3cab6194a49a07d6c23
options:
  basename: nisseg
  # extracted from disks/eu/P.DRV by tools/extract_drv.py
  target_path: build/eu/disks/NISSEG.BIN
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/nisseg
  src_path: src/nisseg
  build_path: build/eu

  ld_script_path: build/eu/generated/nisseg.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x8007A224

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # the symbols of the executable the overlay was built for, which it calls
  # and reads: not SLES_039.00 (see the file)
  symbol_addrs_path:
    - config/eu/symbols_nisseg_exe.txt
    # and its own
    - config/eu/symbols_nisseg.txt
  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_nisseg.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_nisseg.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  create_data_pads: False
  # no C yet: the overlay's code is still splat's assembly
  create_c_files: False

segments:
  # loaded at 0x801E5FE0, not at OVERLAY_LOAD_ADDR as the other overlays (its
  # calls to its own functions say where)
  - name: nisseg
    type: code
    start: 0x0
    vram: 0x801E5FE0
    align: 4
    subalign: 4
    subsegments:
      # jp's modules (config/jp/nisseg.yaml), each with its rodata and data,
      # and a debug menu jp doesn't have: its code follows the model viewer,
      # its menus sit between the trade's data and the deck editor's
      - [0x0, .rodata, title/nis_title]
      - [0x7C, .rodata, trade/nis_trade]
      - [0x33C, .rodata, vs/nis_vs_deck_select]
      - [0x3DC, .rodata, vs/nis_vs_mode]
      - [0x580, .rodata, deck/nis_auto_deck]
      - [0x600, .rodata, deck/nis_deck_windows]
      - [0xDC8, .rodata, deck/nis_deck_scene]
      - [0xDD0, .rodata, deck/nis_deck_editor]
      - [0xF40, .rodata, viewer/nis_model_viewer]
      - [0x1038, .rodata, debug/nis_debug_menu]
      - [0x1048, c, title/nis_title]
      - [0x1858, c, trade/nis_trade]
      - [0x6378, c, vs/nis_vs_deck_select]
      - [0x6D90, c, vs/nis_vs_mode]
      - [0x78E0, c, deck/nis_auto_deck]
      - [0xA3A0, c, deck/nis_deck_windows]
      - [0xDD34, c, deck/nis_deck_scene]
      - [0xE0F4, c, deck/nis_deck_editor]
      - [0x11E58, c, viewer/nis_model_viewer]
      - [0x129E4, c, debug/nis_debug_menu]
      # the zeroed data's object, which has no code
      - [0x130E8, c, nis_bss]
      - [0x130E8, .data, title/nis_title]
      - [0x13154, .data, trade/nis_trade]
      - [0x13248, .data, debug/nis_debug_menu]
      - [0x133D8, .data, deck/nis_deck_editor]
      - [0x135C8, .data, deck/nis_auto_deck]
      - [0x135F8, .data, deck/nis_deck_windows]
      - [0x13A08, .data, viewer/nis_model_viewer]
      - [0x13A48, .data, nis_bss]

  - [0x13F64]
