# Digimon Digital Card Battle, Europe (SLES-03900): the executable
name: main
sha1: 050ae623135d5c233c255c9e76956eaeabd2fa6e
options:
  basename: main
  target_path: disks/eu/SLES_039.00
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/main
  asset_path: asm/eu/main/bin
  src_path: src/main
  build_path: build/eu

  ld_script_path: build/eu/generated/main.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  # what the startup code (__SN_ENTRY_POINT) sets $gp to, 4 bytes before
  # the start of .bss
  gp_value: 0x8007A224

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/eu/symbols.txt
  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_main.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_main.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  create_data_pads: False
  # no C yet: the game's code is still splat's assembly
  create_c_files: False

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    # the startup code clears .bss up to 0x801E0890, OVERLAY_LOAD_ADDR
    bss_size: 0x166668
    align: 4
    subalign: 4
    subsegments:
      # psylink places .rdata ahead of .text; the PsyQ SDK's sections are
      # the last of each, as in us, and go apart so that the report leaves
      # them out
      - [0x800, rodata, game]
      - [0x37E0, rodata, psyq]
      # the game's code, from main() on: one asm range for now
      - [0x4800, asm, game]
      - [0x39F90, asm, psyq]
      - [0x60DA0, data, game]
      - [0x61F70, data, psyq]
      - { start: 0x6AA28, type: bss, vram: 0x8007A228, name: game }
      # PsyQ's .bss starts with libspu's; the game's common symbols that come
      # after it stay there, as in us
      - { start: 0x6AA28, type: bss, vram: 0x801DABF8, name: psyq }

  - [0x6B000]
