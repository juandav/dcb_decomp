# Digimon Digital Card Battle, Europe (SLES-03900): INTSEG
name: intseg
sha1: 8af47db71a4aeab5fe9c0748c6c1a58bb4827497
options:
  basename: intseg
  # extracted from disks/eu/P.DRV by tools/extract_drv.py
  target_path: build/eu/disks/INTSEG.BIN
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/intseg
  src_path: src/intseg
  build_path: build/eu

  ld_script_path: build/eu/generated/intseg.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x8007A224

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # the symbols of the executable the overlay was built for, which it calls
  # and reads: not SLES_039.00 (see the file)
  symbol_addrs_path:
    - config/eu/symbols_intseg_exe.txt
    # and its own
    - config/eu/symbols_intseg.txt
  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_intseg.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_intseg.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  create_data_pads: False
  # the C files in src/intseg/ exist
  create_c_files: False

segments:
  # loaded at 0x801E5FE0, not at OVERLAY_LOAD_ADDR as the other overlays (its
  # calls to its own functions say where)
  - name: intseg
    type: code
    start: 0x0
    vram: 0x801E5FE0
    align: 4
    subalign: 4
    subsegments:
      - [0x0, .rodata, intseg]
      - [0x1048, c, intseg]
      - [0x7934, c, int_bss]
      - [0x7934, .data, intseg]
      - [0x7DB0, .data, int_bss]

  - [0x7F28]
