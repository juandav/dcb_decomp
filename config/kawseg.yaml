name: kawseg
sha1: 30006b91f812d6d3163749c5ed846391f7f41b56
options:
  basename: kawseg
  # extracted from disks/us/P.DRV by tools/extract_drv.py
  target_path: build/disks/KAWSEG.BIN
  base_path: ..
  platform: psx
  compiler: GCC

  asm_path: asm/kawseg
  src_path: src/kawseg
  build_path: build

  ld_script_path: build/generated/kawseg.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True
  gp_value: 0x80077A08

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  # the executable's symbols, which the overlay calls and reads
  symbol_addrs_path:
    - config/symbols.txt
    - config/symbols_kawseg.txt

  undefined_funcs_auto_path: build/generated/undefined_funcs_auto_kawseg.txt
  undefined_syms_auto_path: build/generated/undefined_syms_auto_kawseg.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  migrate_rodata_to_functions: True
  create_data_pads: False
  # src/kawseg/kawseg.c exists
  create_c_files: False

segments:
  # loaded at OVERLAY_LOAD_ADDR, the end of the executable's .bss
  - name: kawseg
    type: code
    start: 0x0
    vram: 0x801DDF38
    align: 4
    subalign: 4
    subsegments:
      - [0x0, .rodata, kawseg]
      - [0x1F4C, c, kawseg]
      - [0x1DA70, data, kawseg]

  - [0x1EAF8]
